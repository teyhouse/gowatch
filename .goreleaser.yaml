# .goreleaser.yaml (goreleaser v2 schema)

version: 2

builds:
  - id: gowatch
    binary: gowatch
    main: .
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - "7"

release:
  github:
    owner: teyhouse
    name: gowatch
  header: |
    ## GOWATCH ({{ .Date }})

    Attention regarding the Windows-Build: Please run this with administrative privileges!
  footer: |
    ## EOF

    Those were the changes on {{ .Tag }}!
  name_template: "GOWATCH-v{{.Version}}"

archives:
  - id: gowatch
    # format: zip  <- uncomment to switch from tar.gz to zip
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - settings.json
      - event.json
